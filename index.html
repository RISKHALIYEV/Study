<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Zone - Prevent Phone Distraction</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Focus Zone">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233b82f6'/><path d='M30 35h40v30H30z' fill='%23fff'/></svg>">

    <!-- Dynamic Manifest -->
    <link id="dynamic-manifest" rel="manifest" href="">

    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 32px 24px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px);
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .screen.exit {
            opacity: 0;
            transform: translateX(-20px);
        }

        /* Top Bar with Install Button */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 12px;
            min-height: 36px;
        }

        .install-btn {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .install-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* AR Place Screen */
        .ar-viewfinder {
            flex: 1;
            border: 2px dashed rgba(59, 130, 246, 0.5);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: rgba(59, 130, 246, 0.03);
            margin-bottom: 24px;
            cursor: pointer;
        }

        .ar-cube {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.4), rgba(37, 99, 235, 0.6));
            border: 2px solid var(--primary);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulse-cube 2s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .ar-cube svg {
            width: 40px;
            height: 40px;
            fill: #fff;
        }

        @keyframes pulse-cube {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(59, 130, 246, 0.6); }
        }

        .ar-hint {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            padding: 0 16px;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background-color: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-danger {
            background-color: var(--danger);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        /* Lock Screen (Face Down Simulation) */
        .lock-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .lock-icon-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .lock-icon-container svg {
            width: 40px;
            height: 40px;
            fill: var(--danger);
        }

        .timer-display {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -1px;
            margin: 12px 0;
            font-variant-numeric: tabular-nums;
        }

        .warning-text {
            color: var(--danger);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            background: rgba(239, 68, 68, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .stats-row {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .stat-card .val {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 4px;
        }

        .stat-card .lbl {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Simulation Switcher for Demo */
        .simulation-bar {
            position: absolute;
            bottom: 12px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 100;
        }

        .sim-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .sim-btn.active {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Screen 1: Place Focus Zone -->
    <div id="screen-place" class="screen active">
        <div class="top-bar">
            <button id="installAppBtn" class="install-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                O'rnatish
            </button>
        </div>

        <div class="header">
            <h1>Focus Zone</h1>
            <p>Telefoningiz chalg'itishini oldini oling</p>
        </div>

        <div class="ar-viewfinder" id="ar-trigger" onclick="goToLockScreen()">
            <div class="ar-cube">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <div class="ar-hint">Joylash uchun bosing yoki telefonni tekis joyga qo'ying</div>
        </div>

        <button class="btn" onclick="goToLockScreen()">Zona yaratish va boshlash</button>
    </div>

    <!-- Screen 2: Active Lock (Face Down) -->
    <div id="screen-lock" class="screen">
        <div class="top-bar">
            <button style="visibility: hidden;" class="install-btn"></button>
        </div>

        <div class="lock-container">
            <div class="lock-icon-container">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0-2-.9-2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
            </div>

            <div class="header" style="margin-bottom: 0;">
                <h1 id="lock-status-title">NoPhone ruxsat etilgan</h1>
                <p>Telefonni pastga qaratib qo'ying va darsga diqqat qiling</p>
            </div>

            <div class="timer-display" id="timer">25:00</div>

            <div class="warning-text" id="warning-box">⚠️ Telefonni ko'tarmang! Vaqt to'xtaydi</div>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="lbl">Qolgan vaqt</div>
                    <div class="val" id="stat-time">25m</div>
                </div>
                <div class="stat-card">
                    <div class="lbl">Chalg'ishlar</div>
                    <div class="val" id="stat-breaks" style="color: var(--danger);">0 marta</div>
                </div>
            </div>

            <button class="btn btn-danger" onclick="resetToPlace()">Zonani yakunlash</button>
        </div>
    </div>

    <!-- Interactive Simulation Bar -->
    <div class="simulation-bar">
        <button class="sim-btn active" onclick="switchSim('place')">1. Joylash</button>
        <button class="sim-btn" onclick="switchSim('lock')">2. Face-Down Blok</button>
        <button class="sim-btn" onclick="simulatePickUp()">📱 Telefonni olish</button>
    </div>
</div>

<script>
    // --- 1. Dynamic Manifest via Data-URI ---
    const manifestData = {
        name: "Focus Zone",
        short_name: "FocusZone",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#0f172a",
        icons: [
            {
                src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%233b82f6'/><path d='M156 180h200v152H156z' fill='%23fff'/></svg>",
                sizes: "512x512",
                type: "image/svg+xml"
            }
        ]
    };
    const encodedManifest = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestData));
    document.getElementById('dynamic-manifest').setAttribute('href', encodedManifest);

    // --- 2. Inline Service Worker via Blob ---
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'focus-zone-v1';
            const ASSETS_TO_CACHE = [
                location.href,
                './'
            ];

            self.addEventListener('install', (event) => {
                event.waitUntil(
                    caches.open(CACHE_NAME).then((cache) => {
                        return cache.addAll(ASSETS_TO_CACHE);
                    }).then(() => self.skipWaiting())
                );
            });

            self.addEventListener('activate', (event) => {
                event.waitUntil(
                    caches.keys().then((keys) => {
                        return Promise.all(
                            keys.map((key) => {
                                if (key !== CACHE_NAME) {
                                    return caches.delete(key);
                                }
                            })
                        );
                    }).then(() => self.clients.claim())
                );
            });

            self.addEventListener('fetch', (event) => {
                event.respondWith(
                    caches.match(event.request).then((cachedResponse) => {
                        if (cachedResponse) {
                            return cachedResponse;
                        }
                        return fetch(event.request).catch(() => {
                            // Fallback for offline if page not cached directly
                            return caches.match('./');
                        });
                    })
                );
            });
        `;

        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);

        window.addEventListener('load', () => {
            navigator.serviceWorker.register(swUrl)
                .then((reg) => console.log('ServiceWorker registered successfully:', reg.scope))
                .catch((err) => console.error('ServiceWorker registration failed:', err));
        });
    }

    // --- 3. BeforeInstallPrompt Handler ---
    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            console.log('App installed');
        }
        deferredPrompt = null;
        installBtn.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
        installBtn.style.display = 'none';
        deferredPrompt = null;
        console.log('PWA was installed successfully');
    });

    // --- 4. Original App Logic ---
    let timerInterval = null;
    let totalSeconds = 25 * 60;
    let breaksCount = 0;
    let isPhonePickedUp = false;

    function goToLockScreen() {
        document.getElementById('screen-place').classList.remove('active');
        document.getElementById('screen-place').classList.add('exit');
        
        setTimeout(() => {
            document.getElementById('screen-lock').classList.add('active');
            document.getElementById('screen-place').classList.remove('exit');
            startTimer();
        }, 300);

        updateSimBtns('lock');
    }

    function resetToPlace() {
        clearInterval(timerInterval);
        document.getElementById('screen-lock').classList.remove('active');
        document.getElementById('screen-place').classList.add('active');
        totalSeconds = 25 * 60;
        breaksCount = 0;
        isPhonePickedUp = false;
        updateTimerDisplay();
        document.getElementById('stat-breaks').innerText = breaksCount + ' marta';
        document.getElementById('lock-status-title').innerText = "NoPhone ruxsat etilgan";
        document.getElementById('warning-box').style.display = "block";
        updateSimBtns('place');
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!isPhonePickedUp && totalSeconds > 0) {
                totalSeconds--;
                updateTimerDisplay();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        const formatted = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        document.getElementById('timer').innerText = formatted;
        document.getElementById('stat-time').innerText = mins + 'm';
    }

    function simulatePickUp() {
        if (!document.getElementById('screen-lock').classList.contains('active')) {
            goToLockScreen();
        }
        isPhonePickedUp = true;
        breaksCount++;
        document.getElementById('stat-breaks').innerText = breaksCount + ' marta';
        document.getElementById('lock-status-title').innerText = "❌ DIQQAT BUZILDI!";
        document.getElementById('warning-box').style.display = "none";
        document.getElementById('timer').style.color = "var(--danger)";
        setTimeout(() => {
            document.getElementById('timer').style.color = "var(--text-main)";
        }, 500);
    }

    function switchSim(screen) {
        if(screen === 'place') {
            resetToPlace();
        } else {
            goToLockScreen();
        }
    }

    function updateSimBtns(activeScreen) {
        const btns = document.querySelectorAll('.sim-btn');
        btns.forEach(b => b.classList.remove('active'));
        if(activeScreen === 'place') {
            btns[0].classList.add('active');
        } else {
            btns[1].classList.add('active');
        }
    }
</script>

</body>
</html>
